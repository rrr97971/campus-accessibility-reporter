events {
    worker_connections 1024;
}

http {
    upstream backend_cluster {
        # Round-robin load balancing across 3 backend instances (Question 1a)
        server backend1:5000 max_fails=2 fail_timeout=10s;
        server backend2:5000 max_fails=2 fail_timeout=10s;
        server backend3:5000 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # High availability & zero-downtime failover (Question 1c)
            # Retries next healthy backend instance if one fails or times out
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}
